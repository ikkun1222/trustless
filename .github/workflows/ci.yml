name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (full suite, race detector)
        run: go test ./... -race
      - name: Coverage
        run: |
          go test ./... -coverprofile=/tmp/cover.out > /dev/null
          go tool cover -func=/tmp/cover.out | tail -1
          total=$(go tool cover -func=/tmp/cover.out | awk '/^total:/{gsub("%","",$NF); print $NF}')
          echo "total coverage: ${total}%"
          if awk "BEGIN{exit !($total < 45.0)}"; then
            echo "::error::coverage ${total}% below threshold 45%"
            exit 1
          fi
      - name: Vulnerability audit (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  auto-merge:
    needs: [test]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve Dependabot PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for Dependabot PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
