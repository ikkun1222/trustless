name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # cosign keyless signing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="$GITHUB_REF_NAME"   # e.g. v0.5.1
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o "dist/trustless-$1-$2" .
          done
          # チェックサムはファイル名のみの形式（dist/ プレフィックスなし）で検証可能にする
          (cd dist && sha256sum trustless-* > SHA256SUMS)

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: spdx-json
          output-file: dist/trustless.sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          for f in dist/trustless-* dist/SHA256SUMS dist/trustless.sbom.spdx.json; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
